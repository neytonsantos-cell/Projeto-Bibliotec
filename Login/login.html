<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliotec - Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="shortcut icon" href="../imgs/Icone - Bibliotec.png" type="image/x-icon">
</head>
<body>
    <header class="cabecalho">
        <a href="../Home/home.html">
            <img src="../imgs/Logo Horizontal - branca.svg" alt="Logo da Bibliotec">
        </a>
        <nav class="navegacao">
            <a href="../Home/home.html">Home</a>
        </nav>
    </header>
    <main class="conteudo">
        <section class="login">
            <div class="login-cabecalho">
                <img src="../imgs/Icone - Bibliotec.png" alt="Ícone da Bibliotec">
                <h1>Bem vindo(a) à Bibliotec</h1>
                <p>Acesse sua conta para continuar</p>
            </div>
            <form>
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Digite seu email de acesso">
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="senha" placeholder="Digite sua senha">
                        <button id="mostrar-senha" class="botao-olho">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <button class="botao-entrar">Entrar</button>
                <button class="botao-google">
                    <img src="../imgs/icone-google.svg" alt="Logo do Google">
                    <span>Entrar com o Google</span>
                </button>
            </form>
        </section>
    </main>
    <script src="login.js"></script>
</body>
</html>
